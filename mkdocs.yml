site_name: chilichip console hardware
site_description: Specifications, pin map, modules and build guide for the open hardware chilichip console.
site_url: https://hardware.chilichip.eu/
repo_url: https://github.com/chili-chip/vgc-zero-hardware
repo_name: chili-chip/vgc-zero-hardware
edit_uri: edit/master/docs/
copyright: The chilichip console hardware is MIT licensed. Made by chilichip.

exclude_docs: |
  /requirements.txt
  /next-revision.md

theme:
  name: material
  logo: assets/chili.svg
  favicon: assets/chili.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - toc.follow

extra_css:
  - assets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Console:
      - console/index.md
      - Specifications: console/specifications.md
      - Architecture: console/architecture.md
      - Pin map: console/pin-map.md
      - Power: console/power.md
      - Mechanical: console/mechanical.md
      - Parts list: console/parts.md
      - Order and build: console/build.md
      - Firmware and software: console/firmware.md
  - Modules:
      - modules/index.md
      - Brain (RP2350-Plus): modules/brain.md
      - Display: modules/display.md
      - Buttons: modules/buttons.md
      - Audio: modules/audio.md
      - Utility: modules/utility.md
      - Radio (RM2): modules/radio.md
  - Revisions and roadmap: revisions.md
  - Work on the hardware: develop.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
