name: KiCad 10 CI & Release

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'    # Example: v0.0.1, v1.2.3
  pull_request:

env:
  SCH_FILE: vgc-zero.kicad_sch
  PCB_FILE: vgc-zero.kicad_pcb

  OUT_SCH_PDF: schematic.pdf
  OUT_GERBERS_DIR: gerbers
  OUT_PCB_IMG: pcb.png

jobs:
  kicad-ci:
    runs-on: ubuntu-latest
    if: github.event_name != 'release'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Run KiCad 10 Actions
        uses: actions-for-kicad/kicad-actions@v2.7-k10.0.7
        with:
          schematic_file_name: ${{ env.SCH_FILE }}
          run_erc: true
          schematic_output_pdf: true

          pcb_file_name: ${{ env.PCB_FILE }}
          run_drc: true
          pcb_output_gerbers_and_drill: true
          pcb_output_image: true

      - name: Show ERC and DRC reports
        if: always()
        run: |
          for f in erc.rpt drc.rpt; do
            if [ -f "$f" ]; then echo "===== $f"; cat "$f"; fi
          done

      # Upload artifacts for release job
      - name: Upload schematic PDF
        uses: actions/upload-artifact@v7
        with:
          name: schematic
          path: ${{ env.OUT_SCH_PDF }}

      - name: Upload gerbers
        uses: actions/upload-artifact@v7
        with:
          name: gerbers
          path: ${{ env.OUT_GERBERS_DIR }}

      - name: Upload PCB image
        uses: actions/upload-artifact@v7
        with:
          name: pcb-image
          path: ${{ env.OUT_PCB_IMG }}

  # JLCPCB fabrication zip (gerbers + drill) and hand-assembly BOM
  jlcpcb:
    runs-on: ubuntu-latest
    if: github.event_name != 'release'
    container:
      image: kicad/kicad:10.0.7
      options: --user root

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install tools
        run: apt-get update && apt-get install -y --no-install-recommends zip

      - name: Export JLCPCB files
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="$(echo "${{ github.sha }}" | cut -c1-7)"
          fi
          scripts/export-jlcpcb.sh "$VERSION" production

      - name: Upload JLCPCB files
        uses: actions/upload-artifact@v7
        with:
          name: jlcpcb
          path: production/

  release:
    permissions: write-all
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [kicad-ci, jlcpcb]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Download artifacts from the build job
      - uses: actions/download-artifact@v8
        with:
          name: schematic
          path: artifacts/schematic
      - uses: actions/download-artifact@v8
        with:
          name: pcb-image
          path: artifacts/pcb-image
      - uses: actions/download-artifact@v8
        with:
          name: gerbers
          path: artifacts/gerbers
      - uses: actions/download-artifact@v8
        with:
          name: jlcpcb
          path: artifacts/jlcpcb

      # Package Gerbers as zip and tar.gz
      - name: Package Gerbers
        run: |
          zip -r artifacts/gerbers.zip artifacts/gerbers
          tar -czf artifacts/gerbers.tar.gz -C artifacts gerbers

      # Create GitHub Release and attach artifacts
      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/schematic/schematic.pdf
            artifacts/pcb-image/pcb.png
            artifacts/gerbers.zip
            artifacts/gerbers.tar.gz
            artifacts/jlcpcb/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
